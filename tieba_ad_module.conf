#!name=贴吧·去广告
#!desc=只解密 c.tieba.baidu.com / tiebac.baidu.com；拒绝开屏与广告竞价接口，并用脚本清理信息流广告卡片

# ==============================================================
# 用法（小火箭）
#   1. 配置 > 模块 > 右上角 + > 从文件导入本文件
#   2. 配置 > 点 sr_trim_fixed.conf 后的 ⓘ > HTTPS 解密 > 证书 > 生成新的 CA > 安装证书
#   3. 设置 > 通用 > 关于本机 > 证书信任设置 > 打开 Shadowrocket 证书
#   4. 配置 > 点 sr_trim_fixed.conf > 使用配置（模块、脚本在此一并编译下载）
#   5. 杀掉贴吧重开 2-3 次（开屏素材有缓存）
#
# 验证脚本是否下载成功：
#   配置 > sr_trim_fixed.conf > 编辑配置 > 脚本 URL，应显示 ✅
#
# 关掉：配置 > 模块 > 关闭本模块开关；再去 ⓘ > HTTPS 解密 关闭
# ==============================================================

[URL Rewrite]
# 开屏广告接口
^https?://(c\.tieba|tiebac)\.baidu\.com/c/f/ad/getSplashAd REJECT
# 广告竞价接口
^https?://(c\.tieba|tiebac)\.baidu\.com/c/b/ad/adBid REJECT
# 广告批量下发接口
^https?://(c\.tieba|tiebac)\.baidu\.com/tiebaads/commonbatch REJECT
# 独立 feed 广告接口（部分版本）
^https?://(c\.tieba|tiebac)\.baidu\.com/c/f/ad/getFeedAd REJECT

# --------------------------------------------------------------
# 只解密这两个域名（精确，不用通配符）
# --------------------------------------------------------------
[MITM]
hostname = %APPEND% c.tieba.baidu.com, tiebac.baidu.com

# --------------------------------------------------------------
# 信息流广告清理：删掉 JSON 响应里的广告字段与广告卡片
# 链接经 jsDelivr 加速，国内可直连
# --------------------------------------------------------------
[Script]
贴吧去广告 = type=http-response,pattern=^https?://(c\.tieba|tiebac)\.baidu\.com/c/(f/(frs/(page|threadlist|generalTabList)|pb/(pic)?page)|b/ad/adBid),requires-body=1,max-size=0,script-path=https://cdn.jsdelivr.net/gh/3222854477/sr-scripts@main/tieba_ad_en.js
